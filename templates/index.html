<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disponibilités Stars 3</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 10px; }
    h1 { text-align: center; color: #1a73e8; margin: 15px 0; }
    .btn { 
      padding: 14px 20px; margin: 8px 4px; border-radius: 12px; font-size: 17px; 
      border: none; cursor: pointer; font-weight: bold; width: 48%;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-success { background: #28a745; color: white; }
    #calendar { max-width: 100%; margin: 15px auto; background: white; border-radius: 12px; padding: 8px; }
    .modal { 
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
      background: white; padding: 25px; border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 10000; 
      width: 92%; max-width: 420px; max-height: 85vh; overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #1a73e8; color: white; }
  </style>
</head>
<body>
  <h1>🌟 Stars 3 - Disponibilités</h1>
  
  <div style="text-align:center; margin:15px 0;">
    <select id="nomSelect" style="padding:14px; font-size:18px; width:95%;"></select>
  </div>

  <div style="text-align:center;">
    <button class="btn btn-primary" onclick="showCalendar()">📅 Renseigner mes disponibilités</button>
    <button class="btn btn-success" onclick="voirPlanning()">📊 Voir le Planning Actuel</button>
  </div>

  <div id="calendar" style="display:none;"></div>

  <script>
    let calendar;
    let currentNom = "";

    document.addEventListener('DOMContentLoaded', () => {
      const noms = {{ noms | tojson }};
      const select = document.getElementById('nomSelect');
      noms.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n; opt.textContent = n;
        select.appendChild(opt);
      });

      calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth',
        locale: 'fr',
        height: 'auto',
        headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
        dateClick: function(info) {
          currentNom = document.getElementById('nomSelect').value;
          if (!currentNom) {
            alert("⚠️ Veuillez d'abord choisir votre nom !");
            return;
          }
          showModal(info.dateStr);
        }
      });
    });

    function showCalendar() {
      document.getElementById('calendar').style.display = 'block';
      calendar.render();
    }

    function showModal(dateStr) {
      let html = `
        <div class="modal">
          <h2>${dateStr}</h2>
          <label><input type="checkbox" id="tout" onchange="toggleTout()"> <strong>Toute la journée</strong></label><br><br>
          
          <div id="slots">
            <div>Matin : <select id="Matin"><option value="DISPO">DISPO</option><option value="PAS DISPO">PAS DISPO</option></select></div>
            <div>Après-midi : <select id="Après-midi"><option value="DISPO">DISPO</option><option value="PAS DISPO">PAS DISPO</option></select></div>
            <div>Soir : <select id="Soir"><option value="DISPO">DISPO</option><option value="PAS DISPO">PAS DISPO</option></select></div>
          </div>
          
          <button onclick="valider('${dateStr}')">✅ VALIDER</button>
          <button onclick="closeModal()" style="background:#ccc;">Annuler</button>
        </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
    }

    function toggleTout() {
      const checked = document.getElementById('tout').checked;
      document.querySelectorAll('#slots select').forEach(s => s.disabled = checked);
    }

    window.valider = function(dateStr) {
      const selections = {};
      if (document.getElementById('tout').checked) {
        const choix = document.getElementById('Matin').value;
        selections["Matin"] = choix;
        selections["Après-midi"] = choix;
        selections["Soir"] = choix;
      } else {
        selections["Matin"] = document.getElementById('Matin').value;
        selections["Après-midi"] = document.getElementById('Après-midi').value;
        selections["Soir"] = document.getElementById('Soir').value;
      }

      fetch('/sauvegarder', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({nom: currentNom, date: dateStr, selections})
      })
      .then(r => r.json())
      .then(data => {
        alert(data.message || "✅ Enregistré !");
        closeModal();
      });
    };

    window.closeModal = function() {
      document.querySelectorAll('.modal').forEach(m => m.remove());
    };

    // Fonction pour voir le planning
    window.voirPlanning = function() {
      alert("📊 Fonction 'Voir le Planning Actuel' en cours de développement...\n\nPour l'instant, téléchargez le fichier Excel via Render.");
    };
  </script>
</body>
</html>
